<!-- Tamago password-reset email (AC8a). Wired in supabase/config.toml [auth.email.template.recovery].
     Token-hash link, verified client-side on /auth/reset (D9), so it works on a different device.
     Hosted: paste the same template into Dashboard > Authentication > Emails > Reset password. -->
<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#0f172a;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:420px;background:#ffffff;border-radius:16px;padding:32px;">
            <tr>
              <td>
                <h1 style="margin:0 0 8px;font-size:20px;font-weight:700;">Reset your Tamago password</h1>
                <p style="margin:0 0 24px;font-size:16px;line-height:24px;color:#475569;">
                  We got a request to reset the password for {{ .Email }}. Tap the button to choose a new one.
                </p>
                <p style="margin:0 0 24px;">
                  <a href="{{ .SiteURL }}/auth/reset?token_hash={{ .TokenHash }}&type=recovery"
                     style="display:inline-block;padding:12px 20px;background:#007F45;color:#ffffff;text-decoration:none;border-radius:6px;font-size:16px;font-weight:600;">
                    Set a new password
                  </a>
                </p>
                <p style="margin:0;font-size:14px;line-height:20px;color:#64748b;">
                  This link works once and expires in 1 hour. If you didn't ask to reset your password, you can ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
