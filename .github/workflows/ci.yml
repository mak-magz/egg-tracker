name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, Test & Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:unit
      # Production build check with placeholder env, then assert no secret material is in the output
      - run: bun run build
        env:
          NUXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder-api-key
          NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN: placeholder.firebaseapp.com
          NUXT_PUBLIC_FIREBASE_PROJECT_ID: placeholder-project-id
          NUXT_TURSO_CONTROL_URL: file:local-control.db
      - run: bun run check:build
      # Non-blocking audit
      - run: bun audit
        continue-on-error: true

  migrate:
    name: Turso Control Database Migrations
    needs: [checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile

      - name: Push Control DB Migrations
        if: env.NUXT_TURSO_CONTROL_URL != ''
        run: bun run db:push:control
        env:
          NUXT_TURSO_CONTROL_URL: ${{ secrets.NUXT_TURSO_CONTROL_URL }}
          NUXT_TURSO_CONTROL_AUTH_TOKEN: ${{ secrets.NUXT_TURSO_CONTROL_AUTH_TOKEN }}
